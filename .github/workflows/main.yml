name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taxflow
          POSTGRES_PASSWORD: taxflow_test_password
          POSTGRES_DB: taxflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxflow -d taxflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taxflow:taxflow_test_password@localhost:5432/taxflow_test
      TEST_DATABASE_URL: postgresql://taxflow:taxflow_test_password@localhost:5432/taxflow_test
      BETTER_AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
