services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxtrackrwanda}
      POSTGRES_USER: ${POSTGRES_USER:-taxtrackrwanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxtrackrwanda}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxtrackrwanda} -d ${POSTGRES_DB:-taxtrackrwanda}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
