services:
  - type: cron
    name: taxtrackrwanda-nightly-compliance-score
    runtime: python
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py recalculate_compliance_scores
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: taxtrackrwanda-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://taxtrackrwanda-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: taxtrackrwanda-db
          property: connectionString

  - type: web
    name: taxtrackrwanda-api
    runtime: docker
    plan: starter
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: taxtrackrwanda-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://taxtrackrwanda-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: taxtrackrwanda-db
          property: connectionString

databases:
  - name: taxtrackrwanda-db
    plan: starter
